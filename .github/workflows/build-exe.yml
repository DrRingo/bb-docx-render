name: Build Standalone Executables

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact_name: fill-docx-macos
            exe_path: dist/fill-docx
          - os: ubuntu-20.04
            artifact_name: fill-docx-linux
            exe_path: dist/fill-docx
          - os: windows-latest
            artifact_name: fill-docx-windows
            exe_path: dist/fill-docx.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pyinstaller docxtpl jinja2 python-docx pyyaml pillow tomli lxml

      - name: Build executable
        run: |
          pyinstaller --onefile --name fill-docx \
            --hidden-import docxtpl \
            --hidden-import docx \
            --hidden-import jinja2 \
            --hidden-import yaml \
            --hidden-import tomli \
            --hidden-import PIL \
            --hidden-import lxml \
            --hidden-import lxml.etree \
            --hidden-import lxml._elementpath \
            --clean \
            fill_docx_main.py
        shell: bash

      - name: Show build result
        run: ls -lh dist/
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.exe_path }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Rename binaries
        run: |
          mv artifacts/fill-docx-macos/fill-docx  artifacts/fill-docx-macos
          mv artifacts/fill-docx-linux/fill-docx  artifacts/fill-docx-linux
          mv artifacts/fill-docx-windows/fill-docx.exe artifacts/fill-docx-windows.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/fill-docx-macos
            artifacts/fill-docx-linux
            artifacts/fill-docx-windows.exe
          generate_release_notes: true
